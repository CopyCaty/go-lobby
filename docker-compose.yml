services:
  mysql:
    image: mysql:8.0
    container_name: go-lobby-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: go_lobby
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: go-lobby-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: go-lobby-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  api:
    build: .
    container_name: go-lobby-api
    command: ["/app/api"]
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    container_name: go-lobby-worker
    command: ["/app/worker"]
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  migrate:
    image: golang:1.25-alpine
    container_name: go-lobby-migrate
    working_dir: /app
    volumes:
      - ./sql:/app/sql:ro
    command:
      - sh
      - -c
      - |
        go install github.com/pressly/goose/v3/cmd/goose@latest &&
        goose -dir /app/sql mysql "root:123456@tcp(mysql:3306)/go_lobby?parseTime=true&loc=Local" up
    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:

