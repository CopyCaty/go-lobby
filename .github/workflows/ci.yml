name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/worker

      - name: Verify Docker image builds
        run: docker build -t go-lobby:ci .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 git 对象打包，避免 tar . 时工作区变化导致 "file changed as we read it"
      - name: Pack release archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=release.tgz HEAD
          ls -lh release.tgz
          for f in docker-compose.yml Dockerfile config.docker.yaml; do
            tar -tzf release.tgz | grep -qx "$f" || { echo "missing $f in archive"; exit 1; }
          done

      - name: Upload to Tencent Cloud
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          timeout: 10m
          source: release.tgz
          target: /tmp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/go-lobby' }}"

            command -v docker >/dev/null
            docker compose version >/dev/null
            test -f /tmp/release.tgz

            STAGING="/tmp/go-lobby-staging.$$"
            mkdir -p "$STAGING"
            tar xzf /tmp/release.tgz -C "$STAGING"
            rm -f /tmp/release.tgz

            test -f "$STAGING/docker-compose.yml"
            test -f "$STAGING/Dockerfile"
            test -f "$STAGING/config.docker.yaml"

            mkdir -p "$DEPLOY_PATH"
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$STAGING"/. "$DEPLOY_PATH"/
            rm -rf "$STAGING"

            cd "$DEPLOY_PATH"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            docker compose up -d --build
            docker compose ps
