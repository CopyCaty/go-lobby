name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/worker

      - name: Verify Docker image builds
        run: docker build -t go-lobby:ci .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/go-lobby' }}"
            git config --global --add safe.directory "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
